<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rig Tuner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #2a1d14; --paper: #f6f0e2; --bg: #1b2430; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--paper); font-family: 'Nunito', system-ui, sans-serif; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; min-height: 100vh; }
      @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
      h1 { font-family: 'Lilita One', sans-serif; font-weight: 400; margin: 0 0 4px; font-size: 26px; }
      .note { opacity: .75; font-size: 13px; margin: 0 0 12px; line-height: 1.5; }
      #view { width: 100%; aspect-ratio: 8 / 7; border-radius: 12px; overflow: hidden; background: #c9b28d; }
      #view canvas { width: 100%; height: 100%; display: block; }
      aside { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; padding: 14px; align-self: start; }
      label { display: grid; grid-template-columns: 110px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; font-weight: 800; margin: 6px 0; }
      label output { font-family: 'Lilita One', sans-serif; text-align: right; }
      select, button { font: inherit; font-weight: 800; }
      select { width: 100%; padding: 6px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; }
      button { border: 2px solid var(--ink); border-radius: 8px; padding: 6px 12px; background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
      button.primary { background: #ffd23f; }
      button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
      h2 { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 18px; margin: 14px 0 4px; }
      .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      #status { font-size: 13px; margin-top: 8px; min-height: 1.4em; }
      #arenaBox { position: relative; margin-top: 6px; }
      #arenaBox canvas { width: 100%; display: block; border-radius: 8px; border: 2px solid var(--ink); }
      .empty { font-size: 14px; line-height: 1.6; }
      code { background: #efe6d2; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Rig tuner</h1>
        <p class="note">Line up each job's arm-and-tool piece with its shoulder. The loop plays move → swing → charge → stagger. The dashed circle is the fighter's body (sim radius), the yellow arc its reach. Save writes <code>art/rig.json</code> and updates the manifest; reload the game to see it.</p>
        <div id="view"></div>
      </section>
      <aside id="panel"></aside>
    </main>
    <script type="module" src="/src/tools/rig.ts"></script>
  </body>
</html>
