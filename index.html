<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Wars</title>
    <meta name="description" content="Job Wars: an auto-battle arena where 30 real-world jobs fight as RPG heroes. PvP, Gacha card drafts, Story mode." />
    <meta property="og:title" content="Job Wars" />
    <meta property="og:description" content="30 real-world jobs fight as RPG heroes. Watch, draft cards, climb the ranks." />
    <meta property="og:image" content="/art/poster/landscape.webp" />
    <meta name="theme-color" content="#17130f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Special+Elite&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <link rel="stylesheet" href="/src/ui/roster.css" />
  </head>
  <body>
    <!-- boot loader: inline so it paints before any script or stylesheet arrives -->
    <div id="boot">
      <style>
        #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #362a20, #161410 72%); color: #f2efe6; transition: opacity .22s ease, visibility .22s; }
        #boot.done { opacity: 0; visibility: hidden; }
        #boot .bt { display: grid; justify-items: center; gap: 12px; width: min(220px, 76vw); }
        #boot .boot-emblem { display: block; width: 112px; height: 112px; object-fit: contain; }
        #boot h1 { margin: 0 0 8px; font: 400 40px/1 'Lilita One', 'Arial Black', sans-serif; letter-spacing: 1px; color: #ffd23f; text-shadow: 0 3px #20170f; white-space: nowrap; }
        #boot h1 span { color: #fa7354; }
        #boot .bar { width: 100%; height: 5px; border-radius: 4px; background: #5d4b38; overflow: hidden; }
        #boot .fill { height: 100%; width: 0; border-radius: inherit; background: #ffd23f; transition: width .2s ease; }
        #boot .row { width: 100%; display: flex; justify-content: space-between; gap: 6px; font: 600 13px/1.4 'Nunito', system-ui, sans-serif; }
        #boot .pct { font-variant-numeric: tabular-nums; }
        @media (prefers-reduced-motion: reduce) { #boot, #boot .fill { transition: none; } }
      </style>
      <div class="bt">
        <img class="boot-emblem" src="/art/ui/boot-emblem.webp" alt="" width="112" height="112" fetchpriority="high" />
        <h1>JOB <span>WARS</span></h1>
        <div class="bar" aria-hidden="true"><div class="fill"></div></div>
        <div class="row"><span class="what" role="status">Loading…</span><span class="pct" aria-hidden="true">0%</span></div>
      </div>
    </div>
    <div id="stage">
      <div id="hud">
        <div class="banner" id="b0"></div>
        <div class="clock"><div id="timer">99</div><div id="seed"></div></div>
        <div class="banner right" id="b1"></div>
        <div class="banner second" id="b2"></div>
        <div class="banner right second" id="b3"></div>
      </div>
      <div id="vig0" class="vignette left"></div>
      <div id="vig1" class="vignette right"></div>
      <div id="flash"></div>
      <div id="callout"></div>
      <div id="replay"><div class="rp-tag"><i></i>REPLAY</div><button class="rp-skip" data-act="skipreplay">Skip replay ›</button></div>
      <div id="panel"></div>
      <nav id="controls" aria-label="Fight controls">
        <div class="fight-group" role="group" aria-label="Match">
          <button data-act="menu">Menu</button>
          <button data-act="select" title="Choose fighters (F)">Fighters</button>
          <button data-act="new" title="Rematch, new seed (R)">Rematch</button>
        </div>
        <div class="fight-group" role="group" aria-label="Playback">
          <button data-act="buffs" class="cards-btn" title="Both sides' cards (B)">Cards</button>
          <button data-act="pause" title="Pause (Space)">Pause</button>
          <button data-act="speed" title="Playback speed (S)">1×</button>
          <details class="fight-more">
            <summary>More</summary>
            <div>
              <button data-act="replay" title="Replay same seed (T)">Replay</button>
              <button data-act="share" title="Copy a link to this exact fight (K)">Share</button>
            </div>
          </details>
        </div>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
